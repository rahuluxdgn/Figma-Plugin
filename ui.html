<!doctype html>
<html>
<head>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; color: var(--figma-color-text); background: var(--figma-color-bg); }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px 18px 84px; font-size: 11px; }
    .eyebrow { color: var(--figma-color-text-secondary); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.03em; line-height: 1.1; }
    .intro { color: var(--figma-color-text-secondary); line-height: 1.45; margin: 8px 0 18px; font-size: 12px; }
    .selection { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--figma-color-border); border-radius: 10px; background: var(--figma-color-bg-secondary); margin-bottom: 18px; }
    .selection-icon { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--figma-color-bg-brand); color: white; font-size: 14px; }
    .selection-copy { min-width: 0; flex: 1; } .selection-title { font-weight: 700; } .selection-subtitle { color: var(--figma-color-text-secondary); margin-top: 2px; }
    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 0 0 8px; font-size: 11px; font-weight: 700; }
    .section-title span { color: var(--figma-color-text-tertiary); font-weight: 500; }
    .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; position: relative; }
    .theme-card { padding: 10px; border: 1px solid var(--figma-color-border); border-radius: 10px; background: var(--figma-color-bg-secondary); }
    .theme-card.light { border-top: 2px solid #f6b73c; grid-column: 1; grid-row: 1; } .theme-card.dark { border-top: 2px solid #7b61ff; grid-column: 2; grid-row: 1; }
    .theme-name { display: flex; gap: 6px; align-items: center; font-weight: 700; margin-bottom: 9px; } .theme-dot { width: 7px; height: 7px; border-radius: 50%; background: #f6b73c; } .dark .theme-dot { background: #7b61ff; }
    select { width: 100%; border: 1px solid var(--figma-color-border); border-radius: 7px; padding: 8px 7px; background: var(--figma-color-bg); color: var(--figma-color-text); font-size: 11px; margin-bottom: 7px; }
    select:last-child { margin-bottom: 0; }
    .swap { position: absolute; left: calc(50% - 14px); top: calc(50% - 14px); width: 28px; height: 28px; border: 1px solid var(--figma-color-border); border-radius: 50%; background: var(--figma-color-bg); color: var(--figma-color-text-secondary); cursor: pointer; padding: 0; z-index: 2; }
    .hint { color: var(--figma-color-text-secondary); font-size: 10px; line-height: 1.4; margin: 12px 2px 0; }
    .footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 18px 16px; background: var(--figma-color-bg); border-top: 1px solid var(--figma-color-border); }
    button.primary { width: 100%; border: 0; border-radius: 8px; padding: 11px; background: var(--figma-color-bg-brand); color: white; cursor: pointer; font-weight: 700; font-size: 12px; } button:disabled { opacity: .45; cursor: default; }
    #error { color: var(--figma-color-text-danger); min-height: 15px; margin-top: 10px; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="eyebrow">Developer handoff tool</div>
  <h1>Theme Compare</h1>
  <p class="intro">Preview the same selection in two variable modes—side by side, on canvas.</p>

  <div class="selection">
    <div class="selection-icon">⌘</div>
    <div class="selection-copy"><div class="selection-title" id="status">No selection</div><div class="selection-subtitle">Select one or more frames or variants</div></div>
  </div>

  <div class="section-title">Compare modes <span id="modeCount">2 modes</span></div>
  <div class="theme-card" style="border-top:2px solid #7b61ff"><div class="theme-name"><i class="theme-dot"></i>Variable collection</div><select id="collection"></select></div>
  <div id="modeList" style="margin-top:8px"></div>
  <button class="swap" id="addMode" style="position:static;width:100%;border-radius:8px;margin-top:10px">＋ Add mode</button>
  <div class="hint">Each selected mode becomes a labeled horizontal panel. Originals stay untouched.</div><div id="error"></div>
  <div class="footer"><button class="primary" id="compare" disabled>Compare on canvas <span>→</span></button></div>

  <script>
    const $=id=>document.getElementById(id), collections=__COLLECTIONS__, collection=$('collection'), list=$('modeList'), add=$('addMode'), compare=$('compare');
    collection.innerHTML=collections.map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
    function escapeHtml(v){return v.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));}
    function current(){return collections.find(c=>c.id===collection.value)||{modes:[]};}
    function render(){const modes=current().modes;const selected=[...list.querySelectorAll('select')].map(s=>s.value);list.innerHTML=selected.map((id,i)=>`<div class="theme-card" style="margin-bottom:8px;display:flex;gap:8px;align-items:center"><span style="color:#7b61ff;font-size:16px">●</span><select data-mode style="margin:0;flex:1">${modes.map(m=>`<option value="${m.id}" ${m.id===id?'selected':''}>${escapeHtml(m.name)}</option>`).join('')}</select>${i>1?'<button data-remove style="width:28px;padding:6px">×</button>':''}</div>`).join('');$('modeCount').textContent=`${selected.length} modes`;add.disabled=selected.length>=modes.length;compare.disabled=selected.length<2;list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{b.parentElement.remove();render();});}
    collection.onchange=()=>{list.innerHTML='';render();};add.onclick=()=>{const ids=[...list.querySelectorAll('select')].map(s=>s.value);const next=current().modes.find(m=>!ids.includes(m.id));if(next){const row=document.createElement('div');row.innerHTML=`<select data-mode><option value="${next.id}">${escapeHtml(next.name)}</option></select>`;list.appendChild(row.firstElementChild);render();}};
    list.innerHTML=`<select data-mode><option value="${current().modes[0]?.id||''}">${escapeHtml(current().modes[0]?.name||'No modes')}</option></select><select data-mode><option value="${current().modes[1]?.id||''}">${escapeHtml(current().modes[1]?.name||'Add a mode')}</option></select>`;render();
    compare.onclick=()=>{const modes=[...list.querySelectorAll('[data-mode]')].map(s=>({id:s.value,name:s.options[s.selectedIndex].text}));$('error').textContent='';parent.postMessage({pluginMessage:{type:'compare',collectionId:collection.value,modes}},'*');};
    window.onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;if(m.type==='selection')$('status').textContent=m.count?`${m.count} ${m.count===1?'node':'nodes'} selected`:'No selection';if(m.type==='error')$('error').textContent=m.message;};
  </script>
</body>
</html>

</body>
</html>
