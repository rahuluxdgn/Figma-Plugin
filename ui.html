<!doctype html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --bg: #ffffff;
      --text: #12121a;
      --muted: #6b6b72;
      --soft: #f6f6f8;
      --line: #ebebef;
      --line-2: #dcdce1;
      --brand-1: #ff5db1;
      --brand-2: #7c3aed;
      --brand-3: #3b82f6;
      --accent: #7c3aed;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: transparent;
      font-size: 13px;
      overflow: hidden;
    }
    /* Gradient frame wraps the plugin so the gradient is only a border, not full background */
    .frame {
      /* Fit the Figma plugin viewport exactly; never extend into the toolbar. */
      margin: 0;
      height: 100%;
      max-height: 100%;
      background: linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 50%, var(--brand-3) 100%);
      border-radius: 0;
      padding: 4px;
      box-shadow: none;
      display: flex;
    }
    .plugin {
      background: var(--bg);
      border-radius: 16px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      flex: none;
    }
    .logo { display: flex; align-items: center; gap: 9px; }
    .logo-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: linear-gradient(135deg, #ff5db1 0%, #7c3aed 100%);
      display: grid; place-items: center; color: white;
      box-shadow: 0 3px 8px rgba(124,58,237,.3);
    }
    .logo-mark svg { width: 16px; height: 16px; }
    .logo-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .close {
      width: 28px; height: 28px; border-radius: 14px;
      background: var(--soft); border: 0; color: var(--muted);
      cursor: pointer; display: grid; place-items: center;
      font-size: 14px; line-height: 1;
    }
    .close:hover { background: var(--line); color: var(--text); }

    /* Body layout */
    .body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 116px; padding: 2px 8px 10px;
      display: flex; flex-direction: column; gap: 2px;
      flex: none;
    }
    .nav {
      display: flex; align-items: center; padding: 7px 11px;
      border-radius: 9px; cursor: pointer;
      font-size: 12px; font-weight: 500; color: var(--muted);
      border: 0; background: transparent; text-align: left;
      width: 100%;
    }
    .nav:hover { background: var(--soft); }
    .nav.active {
      background: var(--text); color: white; font-weight: 600;
    }

    /* Main content wrapper (column with scrollable main + fixed footer) */
    .main-wrapper {
      flex: 1; min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
    }
    .main {
      flex: 1; min-width: 0; padding: 14px 12px 8px 2px;
      display: flex; flex-direction: column; gap: 9px;
      overflow-y: auto;
      min-height: 0;
    }
    .main::-webkit-scrollbar { width: 5px; }
    .main::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

    /* (legacy eyebrow/meta/tabs removed — replaced by .section-head) */

    /* Cards */
    .cards { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: white; border: 1px solid var(--line); border-radius: 12px;
      padding: 9px 11px; display: flex; flex-direction: column; gap: 7px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .card-head {
      display: flex; align-items: center; gap: 10px;
    }
    .checkbox {
      width: 18px; height: 18px; border-radius: 5px; flex: none;
      background: var(--accent); display: grid; place-items: center;
      color: white; cursor: pointer;
    }
    .checkbox.unchecked {
      background: white; border: 1.5px solid var(--line-2);
    }
    .checkbox svg { width: 11px; height: 11px; }
    .card-label { flex: 1; font-weight: 600; font-size: 13px; }
    .card-count {
      padding: 3px 8px; border-radius: 6px;
      background: var(--soft); color: var(--muted);
      font-size: 11px; font-weight: 500;
    }
    .card-remove {
      width: 22px; height: 22px; border-radius: 6px;
      background: transparent; border: 0; color: var(--muted);
      cursor: pointer; display: grid; place-items: center;
      font-size: 14px; line-height: 1;
    }
    .card-remove:hover { background: var(--soft); color: #ef4444; }

    .collection-pick {
      width: 100%; border: 1px solid var(--line); border-radius: 9px;
      padding: 6px 9px; background: #fafafb;
      font-family: inherit; font-size: 11.5px; color: var(--text);
    }
    .collection-pick:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    .modes {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .mode-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 8px 4px 8px; border-radius: 999px;
      background: linear-gradient(135deg, rgba(124,58,237,.08), rgba(255,93,177,.08));
      border: 1px solid rgba(124,58,237,.2);
      font-size: 10.5px; font-weight: 600; color: var(--accent);
    }
    .mode-pill .x {
      width: 14px; height: 14px; border-radius: 7px;
      background: rgba(124,58,237,.18); display: grid; place-items: center;
      cursor: pointer; color: var(--accent);
    }
    .mode-pill .x:hover { background: rgba(124,58,237,.3); color: white; }
    .add-pill {
      padding: 5px 10px; border-radius: 999px;
      background: white; border: 1px dashed var(--line-2);
      color: var(--muted); cursor: pointer; font-size: 11px;
      font-weight: 500; font-family: inherit;
    }
    .add-pill:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
    .add-pill:disabled { opacity: .5; cursor: default; }

    .swatches {
      display: flex; gap: 4px;
      padding-top: 6px; border-top: 1px dashed var(--line);
    }
    .swatch {
      flex: 1; height: 22px; border-radius: 5px;
      background: linear-gradient(135deg, rgba(124,58,237,.18), rgba(124,58,237,.06));
      border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      font-size: 8.5px; color: var(--muted); font-weight: 600;
      overflow: hidden; white-space: nowrap;
      padding: 0 3px;
    }
    .swatch.disabled { opacity: .35; }

    .add-card {
      width: 100%; border: 1px dashed var(--line-2);
      background: transparent; color: var(--muted); border-radius: 12px;
      padding: 9px; cursor: pointer; font-size: 11px;
      font-weight: 500; font-family: inherit;
    }
    .add-card:hover:not(:disabled) {
      color: var(--text); border-color: var(--muted);
    }
    .add-card:disabled { opacity: .5; cursor: default; }

    /* Selection strip */
    .selection-strip {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 11px; border-radius: 10px;
      background: var(--soft); border: 1px solid var(--line);
      font-size: 10.5px;
    }
    .selection-strip .ico {
      width: 22px; height: 22px; border-radius: 6px;
      background: var(--accent); color: white;
      display: grid; place-items: center; font-size: 11px; flex: none;
    }
    .selection-strip .copy { flex: 1; min-width: 0; }
    .selection-strip .title { font-weight: 700; font-size: 11.5px; }
    .selection-strip .sub { color: var(--muted); margin-top: 1px; }

    /* Selection hero — the visual anchor of the UI */
    .selection-hero {
      position: sticky; top: 6px; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 18px 16px;
      margin-top: 0; margin-bottom: 2px;
      border-radius: 14px;
      background: linear-gradient(135deg, #faf7ff 0%, #f4f0ff 50%, #eef4ff 100%);
      border: 1px solid rgba(124, 58, 237, .12);
      box-shadow: 0 8px 16px rgba(18,18,26,.08);
      overflow: hidden;
      transition: all .25s ease;
    }
    .selection-hero.has-selection {
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 60%, #ec4899 100%);
      border-color: transparent;
      box-shadow: 0 8px 24px rgba(124, 58, 237, .35);
    }
    .selection-hero.has-selection .selection-eyebrow,
    .selection-hero.has-selection .selection-sub { color: rgba(255,255,255,.85); }
    .selection-hero.has-selection .count-num,
    .selection-hero.has-selection .count-lbl { color: white; }

    .selection-orb {
      position: relative;
      width: 48px; height: 48px;
      flex: none;
      border-radius: 14px;
      background: white;
      display: grid; place-items: center;
      box-shadow: 0 4px 12px rgba(124, 58, 237, .25),
                  inset 0 0 0 1px rgba(124, 58, 237, .1);
    }
    .selection-orb .orb-icon {
      position: relative; z-index: 2;
      color: var(--accent);
      width: 24px; height: 24px;
      display: grid; place-items: center;
    }
    .selection-orb .orb-icon svg { width: 100%; height: 100%; }
    .selection-orb .orb-glow {
      position: absolute; inset: -4px;
      border-radius: 18px;
      background: radial-gradient(circle, rgba(124,58,237,.35), transparent 70%);
      opacity: .6;
    }
    .selection-orb .orb-pulse {
      position: absolute; inset: 0;
      border-radius: 14px;
      border: 2px solid rgba(124, 58, 237, .35);
      opacity: 0;
    }
    .selection-hero.has-selection .selection-orb {
      background: rgba(255,255,255,.18);
      box-shadow: 0 4px 16px rgba(0,0,0,.2);
      backdrop-filter: blur(8px);
    }
    .selection-hero.has-selection .selection-orb .orb-icon { color: white; }
    .selection-hero.has-selection .selection-orb .orb-glow {
      background: radial-gradient(circle, rgba(255,255,255,.5), transparent 70%);
    }
    .selection-hero.has-selection .selection-orb .orb-pulse {
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: .8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .selection-info { flex: 1; min-width: 0; }
    .selection-eyebrow {
      font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
      color: var(--accent); text-transform: uppercase;
      margin-bottom: 2px;
    }
    .selection-count {
      display: flex; align-items: baseline; gap: 6px;
      line-height: 1;
    }
    .selection-count .count-num {
      font-size: 28px; font-weight: 800; letter-spacing: -.02em;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .selection-count .count-lbl {
      font-size: 12px; font-weight: 600; color: var(--muted);
    }
    .selection-sub {
      font-size: 10.5px; color: var(--muted);
      margin-top: 4px; line-height: 1.35;
    }

    /* Section header — clean hierarchy between Selection and Groups */
    .section-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 4px 0;
    }
    .section-title { display: flex; align-items: baseline; gap: 8px; }
    .title-main { font-size: 13px; font-weight: 700; color: var(--text); }
    .title-meta { font-size: 10.5px; color: var(--muted); font-weight: 500; }
    .section-stat {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 999px;
      background: var(--soft); font-size: 10.5px; font-weight: 600;
      color: var(--text);
    }
    .stat-dot {
      width: 6px; height: 6px; border-radius: 3px;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
    }

    /* Footer (always pinned at bottom of main-wrapper, not scrollable) */
    .footer {
      flex: none;
      padding: 8px 12px 10px 2px;
      border-top: 1px solid var(--line);
      background: var(--bg);
    }
    .cta {
      width: 100%; border: 0; border-radius: 12px;
      padding: 10px 14px; color: white; cursor: pointer;
      font-weight: 700; font-size: 12.5px; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      background: linear-gradient(135deg, #5b21b6 0%, #8b5cf6 100%);
      box-shadow: 0 6px 18px rgba(124,58,237,.4),
                  0 2px 6px rgba(124,58,237,.25);
    }
    .cta:hover:not(:disabled) { transform: translateY(-1px); }
    .cta:disabled { opacity: .5; cursor: default; box-shadow: none; }
    .cta svg { width: 13px; height: 13px; }

    #error {
      color: #ef4444; font-size: 10.5px; min-height: 12px; line-height: 1.3;
      padding: 0 2px;
    }
    .hint {
      color: var(--muted); font-size: 9.5px; line-height: 1.35; padding: 0 2px;
    }

    .selection-empty { color: var(--muted); }
  </style>
</head>
<body>
  <div class="frame">
  <div class="plugin">
    <div class="header">
      <div class="logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" aria-label="Frame">
            <rect x="4" y="4" width="16" height="16" rx="1.5" stroke="white" stroke-width="2"/>
            <path d="M8 2v4M16 2v4M8 18v4M16 18v-4M2 8h4M2 16h4M18 8h4M18 16h-4" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="logo-title">Theme Compare</div>
      </div>
      <button class="close" id="close" title="Close">×</button>
    </div>

    <div class="body">
      <aside class="sidebar">
        <button class="nav active" data-nav="themes">Themes</button>
        <button class="nav" data-nav="compare">Compare</button>
        <button class="nav" data-nav="present">Present</button>
        <button class="nav" data-nav="setting">Setting</button>
        <button class="nav" data-nav="about">About</button>
      </aside>

      <div class="main-wrapper">
      <main class="main">
        <!-- Selection hero -->
        <section class="selection-hero" id="selectionHero">
          <div class="selection-orb">
            <div class="orb-glow"></div>
            <div class="orb-icon">
              <svg viewBox="0 0 24 24" fill="none" aria-label="Frame">
                <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M3 12h18M12 3v18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>
              </svg>
            </div>
            <div class="orb-pulse"></div>
          </div>
          <div class="selection-info">
            <div class="selection-eyebrow">SELECTION</div>
            <div class="selection-count" id="status">
              <span class="count-num">0</span>
              <span class="count-lbl">frames</span>
            </div>
            <div class="selection-sub" id="selectionSub">Pick frames, components, or instances</div>
          </div>
        </section>

        <!-- Section header -->
        <div class="section-head">
          <div class="section-title">
            <span class="title-main">Collection Groups</span>
            <span class="title-meta" id="groupCountLabel">0 groups</span>
          </div>
          <div class="section-stat">
            <span class="stat-dot"></span>
            <span id="modeCountLabel">0 modes total</span>
          </div>
        </div>

        <div class="cards" id="cards"></div>
        <button class="add-card" id="addGroup">＋ Add collection group</button>

        <div id="error"></div>
        <div class="hint">Each group becomes its own horizontal section on canvas. A collection can only be used once.</div>
      </main>

      <div class="footer">
        <button class="cta" id="compare" disabled>
          <svg viewBox="0 0 24 24" fill="none" aria-label="Frame">
            <rect x="4" y="4" width="16" height="16" rx="1.5" stroke="white" stroke-width="2"/>
            <path d="M8 2v4M16 2v4M8 18v4M16 18v-4M2 8h4M2 16h4M18 8h4M18 16h-4" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Compare on canvas
        </button>
      </div>
      </div>
    </div>
  </div>
  </div>

  <script>
    const SWATCH_COLORS = ['#7c3aed', '#10b981', '#3b82f6', '#ef4444', '#f59e0b', '#ec4899'];
    const $ = id => document.getElementById(id);
    const collections = __COLLECTIONS__;
    const cardsEl = $('cards'), addGroupBtn = $('addGroup'),
          compareBtn = $('compare'), errorEl = $('error'),
          groupCountLabel = $('groupCountLabel'),
          modeCountLabel = $('modeCountLabel');
    let groups = [];

    function escapeHtml(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));}
    function collectionById(id){return collections.find(c=>c.id===id);}
    function usedCollectionIds(){return groups.map(g=>g.collectionId);}
    function availableCollections(forGroupIndex){
      const used=new Set(usedCollectionIds());
      if(forGroupIndex!==undefined){const cur=groups[forGroupIndex]?.collectionId;if(cur)used.delete(cur);}
      return collections.filter(c=>!used.has(c.id));
    }
    function makeId(){return 'g_'+Math.random().toString(36).slice(2,9);}

    function renderCard(group, index){
      const collection = collectionById(group.collectionId) || {name:'Unknown', modes:[]};
      const options = availableCollections(index);
      const swatchColor = SWATCH_COLORS[index % SWATCH_COLORS.length];
      const selectedModeIds = group.modes;
      const totalModes = collection.modes.length;
      const allUsed = selectedModeIds.length >= totalModes;

      const previewCells = collection.modes.map(m => {
        const sel = selectedModeIds.includes(m.id);
        return `<div class="swatch${sel?'':' disabled'}" style="background:${sel?`linear-gradient(135deg, ${swatchColor}33, ${swatchColor}11)`:''}; color:${sel?swatchColor:''}" title="${escapeHtml(m.name)}">${escapeHtml(m.name)}</div>`;
      }).join('');

      const collectionOptions = options.map(c =>
        `<option value="${c.id}" ${c.id===group.collectionId?'selected':''}>${escapeHtml(c.name)}</option>`
      ).join('');

      const modePills = selectedModeIds.map(mid => {
        const mode = collection.modes.find(m => m.id === mid) || {id: mid, name: 'Unknown'};
        return `<span class="mode-pill">${escapeHtml(mode.name)}<span class="x" data-remove-mode="${mid}" title="Remove mode">×</span></span>`;
      }).join('');

      const wrapper = document.createElement('div');
      wrapper.className = 'card';
      wrapper.dataset.groupId = group.id;
      wrapper.style.borderLeftColor = swatchColor;
      wrapper.innerHTML = `
        <div class="card-head">
          <div class="checkbox" data-toggle-group title="Toggle group">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M5 12 L10 17 L19 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="card-label" style="color:${swatchColor}">${escapeHtml(collection.name)}</div>
          <div class="card-count">${selectedModeIds.length}/${totalModes}</div>
          <button class="card-remove" data-remove-group title="Remove group">×</button>
        </div>
        <select class="collection-pick" data-collection-select>${collectionOptions || '<option value="">No collections available</option>'}</select>
        <div class="modes">
          ${modePills}
          ${allUsed ? '' : `<button class="add-pill" data-add-mode>＋ Add mode</button>`}
        </div>
        <div class="swatches">${previewCells}</div>
      `;

      // Toggle group (treat as visual indicator only - all groups are active by default)
      wrapper.querySelector('[data-toggle-group]').onclick = () => {
        // Could mark as inactive for future feature; for now show feedback
        errorEl.textContent = '';
      };

      // Collection change
      const collectionSelect = wrapper.querySelector('[data-collection-select]');
      collectionSelect.onchange = () => {
        const nextId = collectionSelect.value;
        if (!nextId) return;
        if (groups.some((g,i) => i !== index && g.collectionId === nextId)) {
          errorEl.textContent = 'That collection is already used by another group.';
          collectionSelect.value = group.collectionId;
          return;
        }
        errorEl.textContent = '';
        const newCollection = collectionById(nextId);
        group.collectionId = nextId;
        group.modes = newCollection && newCollection.modes.length ? [newCollection.modes[0].id] : [];
        render();
      };

      // Remove mode pill
      wrapper.querySelectorAll('[data-remove-mode]').forEach(btn => {
        btn.onclick = () => {
          const mid = btn.dataset.removeMode;
          if (group.modes.length <= 1) {
            errorEl.textContent = 'Each group needs at least one mode.';
            return;
          }
          errorEl.textContent = '';
          group.modes = group.modes.filter(m => m !== mid);
          render();
        };
      });

      // Add mode pill
      const addModeBtn = wrapper.querySelector('[data-add-mode]');
      if (addModeBtn && !addModeBtn.disabled) {
        addModeBtn.onclick = () => {
          const used = new Set(group.modes);
          const next = collection.modes.find(m => !used.has(m.id));
          if (!next) return;
          group.modes.push(next.id);
          render();
        };
      }

      // Remove group
      const removeGroupBtn = wrapper.querySelector('[data-remove-group]');
      if (removeGroupBtn) {
        removeGroupBtn.onclick = () => {
          groups.splice(index, 1);
          if (groups.length === 0) groups.push(createGroup());
          render();
        };
      }

      return wrapper;
    }

    function createGroup(preferredCollectionId){
      const available = availableCollections();
      const collectionId = preferredCollectionId && available.find(c => c.id === preferredCollectionId)
        ? preferredCollectionId
        : (available[0]?.id || collections[0]?.id);
      const collection = collectionById(collectionId);
      return {
        id: makeId(),
        collectionId,
        modes: collection && collection.modes.length ? [collection.modes[0].id] : []
      };
    }

    function render(){
      cardsEl.innerHTML = '';
      groups.forEach((g,i) => cardsEl.appendChild(renderCard(g,i)));

      const totalModes = groups.reduce((sum,g) => sum + g.modes.length, 0);
      groupCountLabel.textContent = `${groups.length} group${groups.length === 1 ? '' : 's'}`;
      modeCountLabel.textContent = `${totalModes} mode${totalModes === 1 ? '' : 's'} total`;

      const addAvailable = availableCollections().length > 0;
      addGroupBtn.disabled = !addAvailable;
      addGroupBtn.textContent = addAvailable ? '＋ Add collection group' : 'All collections in use';
      compareBtn.disabled = totalModes < 2 || groups.length < 1;
      updateStatus();
    }

    function updateStatus(){
      const count = window.__lastSelectionCount || 0;
      const hero = $('selectionHero');
      const countNum = hero.querySelector('.count-num');
      const countLbl = hero.querySelector('.count-lbl');
      const sub = $('selectionSub');
      countNum.textContent = count;
      countLbl.textContent = count === 1 ? 'frame' : 'frames';
      if (count === 0) {
        hero.classList.remove('has-selection');
        sub.textContent = 'Pick frames, components, or instances';
      } else {
        hero.classList.add('has-selection');
        sub.textContent = 'Ready to compare — pick modes below';
      }
    }

    addGroupBtn.onclick = () => {
      const available = availableCollections();
      if (!available.length) return;
      groups.push(createGroup(available[0].id));
      render();
    };

    compareBtn.onclick = () => {
      errorEl.textContent = '';
      const payload = groups.map(g => {
        const collection = collectionById(g.collectionId);
        const modes = g.modes.map(id => {
          const m = collection.modes.find(mm => mm.id === id);
          return {id, name: m ? m.name : ''};
        });
        return {collectionId: g.collectionId, modes};
      }).filter(g => g.modes.length > 0);
      if (!payload.length) { errorEl.textContent = 'Select at least one mode in a group.'; return; }
      parent.postMessage({pluginMessage:{type:'compare', groups:payload}}, '*');
    };

    $('close').onclick = () => parent.postMessage({pluginMessage:{type:'cancel'}}, '*');

    // Sidebar nav (visual switching)
    document.querySelectorAll('.nav').forEach(nav => {
      nav.onclick = () => {
        document.querySelectorAll('.nav').forEach(n => n.classList.remove('active'));
        nav.classList.add('active');
      };
    });

    window.onmessage = e => {
      const m = e.data.pluginMessage;
      if (!m) return;
      if (m.type === 'selection') { window.__lastSelectionCount = m.count; updateStatus(); }
      if (m.type === 'error') errorEl.textContent = m.message;
    };

    if (collections.length) groups.push(createGroup(collections[0].id));
    render();
  </script>
</body>
</html>
